name: Apply ratings update
# Merges a ready ratings branch on or after its effective date, but only after the issue asking you to run daily_key.sql is closed.
on:
  schedule:
    - cron: '5 8 * * 3'
    - cron: '0 16 * * 2'
  issues:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remind on Tuesday, merge on or after the effective date
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          today=$(TZ=America/Los_Angeles date +%F)
          for ref in $(git branch -r --list 'origin/ratings/*' | sed 's#^ *origin/##'); do
            eff="${ref#ratings/}"
            issue=$(gh issue list --label ratings-update --state all --search "$eff in:title" --json number,state --jq '.[0] | "\(.number) \(.state)"')
            num="${issue% *}"; state="${issue#* }"
            if [ "${{ github.event.schedule }}" = "0 16 * * 2" ]; then
              if [ "$state" = "OPEN" ]; then gh issue comment "$num" --body "Reminder: run the SQL and close this issue before $eff, or the new ratings do not go live."; fi
              continue
            fi
            if [[ "$today" < "$eff" ]]; then echo "$ref: not before $eff"; continue; fi
            if [ "$state" != "CLOSED" ]; then [ -n "$num" ] && gh issue comment "$num" --body "Waiting for the SQL: run it and close this issue, then the new ratings go live."; continue; fi
            git checkout main && git pull -q
            git merge --no-edit "origin/$ref" && git push origin main && git push origin --delete "$ref"
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          done
